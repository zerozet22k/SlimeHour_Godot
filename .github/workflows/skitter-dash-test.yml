name: Test Skitter Dash
on:
  push:
    branches: [main]
    paths:
      - scripts/Combat.gd
      - scripts/RoadObstacles.gd
      - scripts/Main.gd
      - scripts/Hud.gd
      - tools/skitter_dash_test.gd
      - .github/workflows/skitter-dash-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skitter-dash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 ./godot-ci
          chmod +x ./godot-ci
      - name: Run Skitter regression tests
        run: |
          set -euo pipefail
          timeout 240 ./godot-ci --headless --path . --editor --import --quit
          timeout 120 ./godot-ci --headless --path . --script tools/skitter_dash_test.gd
