name: Test F3 Debug Lab
on:
  pull_request:
    paths:
      - scripts/DebugLab.gd
      - scripts/Hud.gd
      - scripts/Main.gd
      - tools/debug_lab_test.gd
      - .github/workflows/debug-lab-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 ./godot-ci
          chmod +x ./godot-ci
      - name: Import scripts and scenes
        run: timeout 240 ./godot-ci --headless --path . --editor --import --quit
      - name: Verify F3 categories, search and sandbox spawning
        run: timeout 120 ./godot-ci --headless --path . --script tools/debug_lab_test.gd
      - name: Preserve Bestiary and mutation separation
        run: timeout 120 ./godot-ci --headless --path . --script tools/bestiary_test.gd
