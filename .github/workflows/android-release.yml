name: Build Android APK for Slime Hour

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-release.yml
      - scripts/**
      - scenes/**
      - assets/**
      - data/**
      - project.godot
      - export_presets.cfg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slime-hour-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          tag="$(awk -F '"' '/^const GAME_VERSION = "/ { print $2; exit }' scripts/Main.gd)"
          [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Godot and Android templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 4 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          cp /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 ./godot-ci
          chmod +x ./godot-ci
          curl -fL --retry 4 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -oq /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Configure Android SDK and signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/slime-hour-release.keystore
          chmod 600 /tmp/slime-hour-release.keystore
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/slime-hour-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Import and export signed release APK
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 300 ./godot-ci --headless --path . --editor --import --quit
          timeout 600 ./godot-ci --headless --path . --export-release Android build/SlimeHour-Android.apk
          test -s build/SlimeHour-Android.apk
          sha256sum build/SlimeHour-Android.apk > build/SlimeHour-Android.apk.sha256
      - name: Upload APK to matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG not found. Publish Windows release first, then rerun this workflow."
            exit 1
          fi
          gh release upload "$TAG" build/SlimeHour-Android.apk build/SlimeHour-Android.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SlimeHour-Android-${{ steps.version.outputs.tag }}
          path: build/SlimeHour-Android.apk
