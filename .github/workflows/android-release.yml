name: Build Android APK for Slime Hour

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-release.yml
      - scripts/**
      - scenes/**
      - assets/**
      - data/**
      - project.godot
      - export_presets.cfg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slime-hour-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          tag="$(awk -F '"' '/^const GAME_VERSION = "/ { print $2; exit }' scripts/Main.gd)"
          [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Godot and Android templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 4 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          cp /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 ./godot-ci
          chmod +x ./godot-ci
          curl -fL --retry 4 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -oq /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          echo "GODOT_ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Import and export Android test APK
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 300 ./godot-ci --headless --path . --editor --import --quit
          timeout 600 ./godot-ci --headless --path . --export-debug Android build/SlimeHour-Android.apk
          test -s build/SlimeHour-Android.apk
          sha256sum build/SlimeHour-Android.apk > build/SlimeHour-Android.apk.sha256
      - name: Upload test APK to matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Android often exports faster than the Windows build. Wait for the
          # release rather than failing because the two jobs run in parallel.
          found=false
          for attempt in $(seq 1 168); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=true
              break
            fi
            echo "Waiting for Windows release $TAG ($attempt/168; next check in 15 seconds)"
            sleep 15
          done
          if [ "$found" != "true" ]; then
            echo "::error::Release $TAG was not published within 42 minutes."
            exit 1
          fi
          gh release upload "$TAG" build/SlimeHour-Android.apk build/SlimeHour-Android.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SlimeHour-Android-${{ steps.version.outputs.tag }}
          path: build/SlimeHour-Android.apk
