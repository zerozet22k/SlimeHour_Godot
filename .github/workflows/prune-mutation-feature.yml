name: Prune merged run-only mutation feature

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-mutation-feature.yml]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove unchanged merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          branch="feature/staged-enemy-fusions-20261010"
          expected="f8956b916621545b5707888d9c3098a1af238e0e"
          test "$(gh api "$repo/pulls/8" -q '.merged')" = "true" || {
            echo "PR 8 not merged: leave branch untouched"; exit 1;
          }
          found="$(gh api "$repo/git/ref/heads/$branch" -q '.object.sha' 2>/dev/null || true)"
          if [ -z "$found" ]; then
            echo "Already removed"; exit 0
          fi
          test "$found" = "$expected" || {
            echo "::error::Branch head changed; no deletion"; exit 1;
          }
          gh api -X DELETE "$repo/git/refs/heads/$branch" >/dev/null
          echo "Removed merged branch $branch"
