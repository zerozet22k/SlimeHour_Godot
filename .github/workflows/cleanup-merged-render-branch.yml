name: Clean merged rendering fix branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-render-branch.yml

permissions:
  contents: write

jobs:
  remove-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the reviewed and merged branch at its audited tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/invisible-world-scene-smoke-20261010'
          expected='c3d226df3ad5a66b98b63f6647a016f364a85762'
          api="repos/$GITHUB_REPOSITORY"
          merged="$(gh api "$api/pulls/5" --jq '.merged')"
          test "$merged" = "true" || { echo "::error::PR #5 not merged"; exit 1; }
          current="$(gh api "$api/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            echo "Already deleted."
            exit 0
          fi
          test "$current" = "$expected" || { echo "::error::Tip changed; refusing to remove branch"; exit 1; }
          gh api -X DELETE "$api/git/refs/heads/$branch" >/dev/null
          echo "Deleted merged branch: $branch"
