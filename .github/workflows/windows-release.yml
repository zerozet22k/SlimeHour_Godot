name: Build and release Slime Hour for Windows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-release.yml
      - scripts/**
      - scenes/**
      - assets/**
      - data/**
      - tools/line_weapon_test.gd
      - tools/status_card_test.gd
      - tools/bestiary_test.gd
      - tools/prerequisite_test.gd
      - tools/bash_bomber_test.gd
      - tools/screen_fit_test.gd
      - tools/boss_music_barrel_test.gd
      - tools/route_transition_test.gd
      - tools/projectile_vfx_balance_test.gd
      - tools/ingame_updater_test.gd
      - tools/road_obstacle_test.gd
      - tools/unlock_history_test.gd
      - tools/weapon_aim_test.gd
      - tools/debug_lab_test.gd
      - tools/chunk_release.py
      - tools/test_delta_powershell.py
      - update_and_run.ps1
      - updater_config.json
      - Start_Slime_Hour.bat
      - project.godot
      - export_presets.cfg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slime-hour-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check game version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(awk -F '"' '/^const GAME_VERSION = "/ { print $2; exit }' scripts/Main.gd)"
          if ! [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then echo "Missing or invalid GAME_VERSION: $tag"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Godot 4.7.2 and Windows export template
        if: steps.version.outputs.needed == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl --fail --location --retry 4 --retry-delay 5 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot-linux.zip
          unzip -oq /tmp/godot-linux.zip -d /tmp/godot-bin
          cp /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 ./godot-ci
          chmod +x ./godot-ci
          ./godot-ci --headless --version

          curl --fail --location --retry 4 --retry-delay 5 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          version_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$version_dir"
          template="$(unzip -Z1 /tmp/godot-templates.tpz | grep -E '(^|/)windows_release_x86_64.exe$' | head -1)"
          test -n "$template"
          unzip -p /tmp/godot-templates.tpz "$template" > "$version_dir/windows_release_x86_64.exe"
          test -s "$version_dir/windows_release_x86_64.exe"
          rm -f /tmp/godot-linux.zip /tmp/godot-templates.tpz

      - name: Import and validate game
        if: steps.version.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python3 tools/validate.py
          ! grep -qi 'powershell.exe' Start_Slime_Hour.bat
          timeout 300 ./godot-ci --headless --path . --editor --import --quit
          timeout 120 ./godot-ci --headless --path . --script tools/line_weapon_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/status_card_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/bestiary_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/prerequisite_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/bash_bomber_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/screen_fit_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/boss_music_barrel_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/route_transition_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/projectile_vfx_balance_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/ingame_updater_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/road_obstacle_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/unlock_history_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/weapon_aim_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/debug_lab_test.gd
          python3 tools/chunk_release.py selftest
          python3 tools/test_delta_powershell.py
          timeout 90 pwsh -NoProfile -File update_and_run.ps1 -ProbeDownload

      - name: Export Windows executable and separate PCK
        if: steps.version.outputs.needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          timeout 600 ./godot-ci --headless --path . --export-release "Windows Desktop" dist/SlimeHour.exe
          test -s dist/SlimeHour.exe
          test -s dist/SlimeHour.pck
          echo "Exe and PCK:"
          ls -lh dist/SlimeHour.exe dist/SlimeHour.pck

      - name: Build full Windows ZIP and optional chunk patch
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cp update_and_run.ps1 updater_config.json Start_Slime_Hour.bat dist/
          python3 tools/chunk_release.py full dist "$RELEASE_TAG" SlimeHour-Windows.zip
          previous="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$previous" ] && [ "$previous" != "$RELEASE_TAG" ]; then
            echo "Previous version: $previous; checking whether it supports partial patches."
            mkdir -p /tmp/slime-previous
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
              --pattern "SlimeHour-Windows.zip" --dir /tmp/slime-previous
            mkdir -p /tmp/slime-previous/files
            unzip -oq /tmp/slime-previous/SlimeHour-Windows.zip -d /tmp/slime-previous/files
            python3 tools/chunk_release.py delta /tmp/slime-previous/files dist SlimeHour-Delta.zip
            if [ -s SlimeHour-Delta.zip ]; then
              echo "Full vs changed-chunks download:"
              ls -lh SlimeHour-Windows.zip SlimeHour-Delta.zip
            fi
          fi

      - name: Publish verified Windows release and optional delta
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(SlimeHour-Windows.zip SlimeHour-Windows.zip.sha256)
          if [ -s SlimeHour-Delta.zip ]; then
            assets+=(SlimeHour-Delta.zip SlimeHour-Delta.zip.sha256 SlimeHour-Delta.json)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Slime Hour $RELEASE_TAG" \
            --notes "Slime Hour $RELEASE_TAG Windows. First install: download the full ZIP, extract and launch. New installations use a separate .pck game-data file. On future updates, the launcher automatically downloads changed chunks when a matching delta is available, SHA256 verifies the assembled game, and otherwise falls back to the full download."
