name: Clean merged totem shield fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-hype-totem-branch.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune Hype Totem branch only if unchanged and merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          target="fix/hype-totem-shield-aura-20261010"
          expected="5f268a391804982ee4b1fec419e4e532bf07fd38"
          test "$(gh api "$repo/pulls/9" --jq '.merged')" = "true" || {
            echo "::error::PR #9 not merged"; exit 1;
          }
          actual="$(gh api "$repo/git/ref/heads/$target" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$actual" ]; then echo "Already deleted"; exit 0; fi
          test "$actual" = "$expected" || {
            echo "::error::Ref changed after review. Refusing to delete."; exit 1;
          }
          gh api -X DELETE "$repo/git/refs/heads/$target" >/dev/null
          echo "Deleted merged branch $target"
