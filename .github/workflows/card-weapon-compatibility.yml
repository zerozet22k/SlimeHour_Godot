name: Card and weapon compatibility

on:
  pull_request:
    paths:
      - scripts/**
      - data/enemies.json
      - tools/hype_totem_aura_test.gd
      - tools/mutation_progression_test.gd
      - scripts/EnemyMixes.gd
      - scripts/Hud.gd
      - data/cards.json
      - data/weapons.json
      - tools/card_weapon_conversion_test.gd
      - tools/weapon_description_test.gd
      - tools/projectile_compatibility_test.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot headless
        run: |
          set -euo pipefail
          url=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 "$url" -o /tmp/godot-linux.zip
          unzip -oq /tmp/godot-linux.zip -d /tmp/godot-bin
          cp /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 ./godot-ci
          chmod +x ./godot-ci
      - name: Validate and import project
        run: |
          set -euo pipefail
          python3 tools/validate.py
          timeout 300 ./godot-ci --headless --path . --editor --import --quit
      - name: Weapon and card regressions
        run: |
          set -euo pipefail
          timeout 120 ./godot-ci --headless --path . --script tools/card_weapon_conversion_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/projectile_compatibility_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/weapon_resource_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/weapon_compatibility_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/hype_totem_aura_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/mutation_progression_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/weapon_description_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/line_weapon_test.gd
          timeout 120 ./godot-ci --headless --path . --script tools/barrel_weapon_test.gd
