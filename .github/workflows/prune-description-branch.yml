name: Clean merged weapon-copy branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-description-branch.yml

permissions:
  contents: write

jobs:
  prune-merged-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only PR 6's already-merged, unchanged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="feature/clear-weapon-descriptions-20261010"
          expected="aab94fab00a8d3da516284b45b0ad874a767eb28"
          repo="repos/$GITHUB_REPOSITORY"
          is_merged="$(gh api "$repo/pulls/6" -q '.merged')"
          test "$is_merged" = "true" || { echo "PR #6 is not merged"; exit 1; }
          current="$(gh api "$repo/git/ref/heads/$target" -q '.object.sha' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            echo "Branch already cleaned"
            exit 0
          fi
          test "$current" = "$expected" || { echo "::error::Branch changed since merging; keep it"; exit 1; }
          gh api -X DELETE "$repo/git/refs/heads/$target" >/dev/null
          echo "Deleted merged branch $target"
