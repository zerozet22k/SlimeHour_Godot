name: Clean merged boss-overhaul branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-boss-overhaul-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune verified merged boss feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="feature/boss-pattern-overhaul-20261010"
          expected="ab204c9ad28de8a899126112e69d67fc566baa61"
          repo="repos/$GITHUB_REPOSITORY"
          merged="$(gh api "$repo/pulls/7" --jq '.merged')"
          test "$merged" = "true" || { echo "PR #7 is not merged"; exit 1; }
          current="$(gh api "$repo/git/ref/heads/$target" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            echo "Branch already removed"
            exit 0
          fi
          test "$current" = "$expected" || { echo "::error::Branch changed; preserving it"; exit 1; }
          gh api -X DELETE "$repo/git/refs/heads/$target" >/dev/null
          echo "Removed merged boss feature branch: $target"
